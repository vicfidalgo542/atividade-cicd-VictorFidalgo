<!DOCTYPE html>
<html lang="pt-BR">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Status CI/CD</title>

    <link

        href="style.css"

</head>

            <p>

        </section>

    <script src="app.js"></script>

</body>

</html>
